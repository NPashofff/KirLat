name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python make_icon.py
      - run: python -m PyInstaller --noconfirm --clean KirLat.spec
      - run: Compress-Archive -Path dist/KirLat/* -DestinationPath KirLat-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KirLat-windows
          path: KirLat-windows.zip

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ApplicationServices
      - run: python make_icon.py
      - run: python -m PyInstaller --noconfirm --clean KirLat.spec
      # Подписваме със стабилен (самоподписан) сертификат от secrets, за да не губи macOS
      # разрешенията Accessibility / Input Monitoring при всяко обновяване (ad-hoc подписът
      # се сменя при всеки билд). Без secrets (напр. fork) – ad-hoc.
      - name: Sign app
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -n "$MAC_CERT_P12" ]; then
            echo "$MAC_CERT_P12" | base64 --decode > cert.p12
            security create-keychain -p tmpkeychain build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p tmpkeychain build.keychain
            security set-keychain-settings -lut 3600 build.keychain
            security import cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k tmpkeychain build.keychain
            openssl pkcs12 -in cert.p12 -passin "pass:$MAC_CERT_PASSWORD" -nokeys -out cert.pem -legacy 2>/dev/null || openssl pkcs12 -in cert.p12 -passin "pass:$MAC_CERT_PASSWORD" -nokeys -out cert.pem
            sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain cert.pem || true
            security find-identity -v -p codesigning build.keychain
            codesign --force --deep --sign "KirLat Self-Signed" --timestamp=none dist/KirLat.app
            rm -f cert.p12 cert.pem
          else
            echo "No signing secrets – ad-hoc signature"
            codesign --force --deep --sign - dist/KirLat.app
          fi
          codesign -dvv dist/KirLat.app 2>&1 | grep -E "Authority|Identifier|TeamIdentifier" || true
          codesign --verify --deep --strict dist/KirLat.app
      - run: ditto -c -k --keepParent dist/KirLat.app KirLat-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KirLat-macos
          path: KirLat-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/KirLat-windows/KirLat-windows.zip
            artifacts/KirLat-macos/KirLat-macOS.zip
          generate_release_notes: true
