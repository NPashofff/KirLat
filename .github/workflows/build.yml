name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python make_icon.py
      - run: python -m PyInstaller --noconfirm --clean KirLat.spec
      - uses: actions/upload-artifact@v4
        with:
          name: KirLat-windows
          path: dist/KirLat.exe

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pyobjc-framework-Cocoa pyobjc-framework-Quartz pyobjc-framework-ApplicationServices
      - run: python make_icon.py
      - run: python -m PyInstaller --noconfirm --clean KirLat.spec
      - run: codesign --force --deep --sign - dist/KirLat.app
      - run: ditto -c -k --keepParent dist/KirLat.app KirLat-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KirLat-macos
          path: KirLat-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/KirLat-windows/KirLat.exe
            artifacts/KirLat-macos/KirLat-macOS.zip
          generate_release_notes: true
